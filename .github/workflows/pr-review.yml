name: Automated AI PR Review & Summary

on:
  pull_request:
    branches: [ back-develop, main, front-develop ]
    types: [ opened, synchronize ]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run AI PR Reviewer
        uses: sshnaidm/gemini-code-review-action@v1
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          model: 'gemini-2.5-flash'
          extra_prompt: |
            You are acting as an expert senior software engineer. Review this Pull Request's code changes. 
            Provide a short summary bulleted list of the changes, and point out any potential logic flaws, safety risks, or architectural improvements. Keep your code review suggestions constructive and direct.
          gemini-key: ''